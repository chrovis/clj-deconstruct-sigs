name: format

on: [push, pull_request]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'
        architecture: x64
    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.1
      with:
        lein: latest
    - name: Install dependencies
      run: lein deps
    - name: Run cljfmt
      run: lein cljfmt check
